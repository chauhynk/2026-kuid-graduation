<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Y2K 캠코더 레트로 인터페이스 -->
  <!-- 상단 상태바 -->
  <g transform="translate(80, 110)">
    <!-- REC 표시 -->
    <circle cx="20" cy="0" r="12" fill="#FF1A1A" filter="url(#glow-red)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="46" y="8" font-family="'Courier New', monospace, sans-serif" font-size="32" font-weight="900" fill="#FF1A1A" letter-spacing="4">REC</text>
    
    <text x="180" y="8" font-family="'Courier New', monospace, sans-serif" font-size="24" font-weight="700" fill="#00FF66" letter-spacing="2">● 00:26:08:30</text>
  </g>

  <!-- 배터리 & 오디오 인디케이터 -->
  <g transform="translate(900, 100)">
    <rect x="0" y="0" width="60" height="30" rx="4" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <rect x="62" y="8" width="6" height="14" rx="2" fill="#FFFFFF" />
    <rect x="6" y="6" width="36" height="18" rx="2" fill="#00FF66" />
    <text x="-20" y="24" text-anchor="end" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#FFFFFF">SP 1080p</text>
  </g>

  <!-- 뷰파인더 가이드라인 & 코너 괄호 -->
  <g stroke="#FFFFFF" stroke-width="3" opacity="0.75" fill="none">
    <!-- 좌상단 -->
    <path d="M 120 280 L 120 200 L 200 200" />
    <!-- 우상단 -->
    <path d="M 960 280 L 960 200 L 880 200" />
    <!-- 좌하단 -->
    <path d="M 120 1640 L 120 1720 L 200 1720" />
    <!-- 우하단 -->
    <path d="M 960 1640 L 960 1720 L 880 1720" />
  </g>

  <!-- 중앙 십자 초점 타겟 -->
  <g transform="translate(540, 960)" stroke="#FFFFFF" stroke-width="2" opacity="0.6" fill="none">
    <circle cx="0" cy="0" r="60" stroke-dasharray="8,6" />
    <line x1="-30" y1="0" x2="-10" y2="0" />
    <line x1="10" y1="0" x2="30" y2="0" />
    <line x1="0" y1="-30" x2="0" y2="-10" />
    <line x1="0" y1="10" x2="0" y2="30" />
    <text x="0" y="90" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#FFFFFF" stroke="none">[ AUTO FOCUS ]</text>
  </g>

  <!-- 좌측 노출/화이트밸런스 수치 -->
  <g transform="translate(80, 960)" font-family="'Courier New', monospace" font-size="18" fill="#00FFCC" font-weight="700">
    <text x="0" y="-40">ISO 400</text>
    <text x="0" y="-10">F 1.8</text>
    <text x="0" y="20">1/250s</text>
    <text x="0" y="50">AWB AUTO</text>
  </g>

  <!-- 하단 타임스탬프 (레트로 VCR 스타일) -->
  <g transform="translate(80, 1820)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="36" font-weight="900" fill="#FFFF00" letter-spacing="4">AUG 30 2026</text>
    <text x="0" y="36" font-family="'Courier New', monospace" font-size="28" font-weight="700" fill="#FFFF00" letter-spacing="3">PM 03:30:12</text>
  </g>

  <g transform="translate(1000, 1820)">
    <text x="0" y="0" text-anchor="end" font-family="'Courier New', monospace" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="3">GRAD-SHOW</text>
    <text x="0" y="36" text-anchor="end" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#00FFCC" letter-spacing="2">PLAY ▶</text>
  </g>
</svg>
