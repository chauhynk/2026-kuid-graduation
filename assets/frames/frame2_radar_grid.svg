<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- 외곽 굵은 대시 테두리 -->
  <rect x="36" y="36" width="1008" height="1848" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-dasharray="16,14" opacity="0.85" />
  <rect x="58" y="58" width="964" height="1804" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />

  <!-- 상단 레이더 텔레메트리 헤더 -->
  <g transform="translate(80, 110)">
    <circle cx="10" cy="10" r="8" fill="#FF1E1E" />
    <text x="30" y="16" font-family="'Noto Sans KR', 'Noto Sans', sans-serif" font-size="18" font-weight="900" letter-spacing="4" fill="#FFFFFF">KUID DEGREE SHOW</text>
    <text x="30" y="38" font-family="'Noto Sans KR', 'Noto Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#00FF2A">STANDBY RADAR SCOPE</text>
  </g>

  <g transform="translate(980, 110)">
    <text x="0" y="16" text-anchor="end" font-family="'Noto Sans KR', 'Noto Sans', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">KUID.26</text>
    <text x="0" y="38" text-anchor="end" font-family="'Noto Sans KR', 'Noto Sans', sans-serif" font-size="12" fill="rgba(255,255,255,0.6)">FPS 60.0</text>
  </g>

  <!-- 4개 모서리 레이더 방사형 스포크 -->
  <g transform="translate(140, 240)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="8,8" />
    <path d="M 0 0 L 60 0 A 60 60 0 0 1 42 42 Z" fill="#FF1E1E" />
    <text x="0" y="80" text-anchor="middle" font-family="'Noto Sans KR', 'Noto Sans', sans-serif" font-size="10" fill="#FFFFFF">ELEVATOR_7F</text>
  </g>

  <g transform="translate(940, 240)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="8,8" />
    <path d="M 0 0 L 0 -60 A 60 60 0 0 1 42 -42 Z" fill="#00FF2A" />
    <text x="0" y="80" text-anchor="middle" font-family="'Noto Sans KR', 'Noto Sans', sans-serif" font-size="10" fill="#FFFFFF">CRITIQUE_LAB</text>
  </g>

  <!-- 중앙 뷰파인더 십자선 & 각도기 -->
  <g transform="translate(540, 960)" stroke="#FFFFFF" opacity="0.6">
    <circle cx="0" cy="0" r="280" fill="none" stroke-width="2" stroke-dasharray="4,8" />
    <circle cx="0" cy="0" r="180" fill="none" stroke-width="1.5" stroke-dasharray="12,12" />
    <circle cx="0" cy="0" r="90" fill="none" stroke-width="1" />
    
    <line x1="-340" y1="0" x2="-20" y2="0" stroke-width="1.5" />
    <line x1="20" y1="0" x2="340" y2="0" stroke-width="1.5" />
    <line x1="0" y1="-340" x2="0" y2="-20" stroke-width="1.5" />
    <line x1="0" y1="20" x2="0" y2="340" stroke-width="1.5" />
    
    <text x="0" y="-100" text-anchor="middle" font-family="'Noto Sans KR', 'Noto Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" stroke="none">000° N</text>
    <text x="110" y="5" font-family="'Noto Sans KR', 'Noto Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" stroke="none">090° E</text>
    <text x="0" y="115" text-anchor="middle" font-family="'Noto Sans KR', 'Noto Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" stroke="none">180° S</text>
    <text x="-110" y="5" text-anchor="end" font-family="'Noto Sans KR', 'Noto Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" stroke="none">270° W</text>
  </g>

  <!-- 하단 정보 패널 -->
  <g transform="translate(80, 1780)">
    <g transform="translate(0, -10)">
      <rect x="0" y="0" width="160" height="30" fill="#FFFFFF" />
      <text x="80" y="20" text-anchor="middle" font-family="'Noto Sans KR', 'Noto Sans', sans-serif" font-size="13" font-weight="900" fill="#000000">KUID // STANDBY</text>
    </g>
    <text x="0" y="50" font-family="'Noto Sans KR', 'Noto Sans', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="3">KONKUK UNIV. ID</text>
    <text x="0" y="78" font-family="'Noto Sans KR', 'Noto Sans', sans-serif" font-size="14" fill="#00FF2A">@KUID_GRADUATION</text>
  </g>

  <g transform="translate(940, 1800)">
    <rect x="-60" y="0" width="28" height="28" fill="#FF1E1E" />
    <rect x="-24" y="0" width="28" height="28" fill="#00FF2A" />
    <rect x="12" y="0" width="28" height="28" fill="#FFFFFF" />
  </g>
</svg>
