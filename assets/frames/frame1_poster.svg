<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#9933FF" />
      <stop offset="100%" stop-color="#00EEFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 외곽 그래픽 테두리 -->
  <rect x="40" y="40" width="1000" height="1840" rx="36" fill="none" stroke="url(#grad1)" stroke-width="4" opacity="0.85" />
  <rect x="54" y="54" width="972" height="1812" rx="24" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" />

  <!-- 모서리 코너 마크 -->
  <path d="M 40 120 L 40 40 L 120 40" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <path d="M 1040 120 L 1040 40 L 960 40" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <path d="M 40 1800 L 40 1880 L 120 1880" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <path d="M 1040 1800 L 1040 1880 L 960 1880" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

  <!-- 상단 헤더 타이포그래피 -->
  <g transform="translate(80, 110)">
    <text x="0" y="0" font-family="'Pretendard', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="6" fill="#FFFFFF">GRADUATION EXHIBITION</text>
    <text x="0" y="32" font-family="'Pretendard', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="3" fill="url(#grad1)">2026 DEGREE SHOW • ARCHIVE</text>
  </g>

  <g transform="translate(1000, 110)">
    <circle cx="-16" cy="-8" r="8" fill="#00FF66" filter="url(#glow)" />
    <text x="-36" y="-2" text-anchor="end" font-family="'Pretendard', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#FFFFFF">LIVE ON</text>
  </g>

  <!-- 중앙 십자 그리드 마크 -->
  <g opacity="0.35">
    <line x1="540" y1="910" x2="540" y2="950" stroke="#FFFFFF" stroke-width="2" />
    <line x1="520" y1="930" x2="560" y2="930" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="540" cy="930" r="30" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- 하단 푸터 및 이벤트 태그 -->
  <g transform="translate(80, 1780)">
    <rect x="0" y="-30" width="220" height="42" rx="21" fill="rgba(255,255,255,0.15)" backdrop-filter="blur(10px)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <text x="110" y="-3" text-anchor="middle" font-family="'Pretendard', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">#OFFICIAL_FILTER</text>
    
    <text x="0" y="45" font-family="'Pretendard', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="2" fill="#FFFFFF">UNFOLD YOUR VISION</text>
    <text x="0" y="75" font-family="'Pretendard', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.7)" letter-spacing="1">SEOUL • HYBRID ARTS CENTER • 2026.09</text>
  </g>

  <!-- 바코드 그래픽 -->
  <g transform="translate(840, 1780)" opacity="0.85">
    <rect x="0" y="-10" width="160" height="50" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="15" y1="0" x2="15" y2="30" stroke="#FFFFFF" stroke-width="4" />
    <line x1="25" y1="0" x2="25" y2="30" stroke="#FFFFFF" stroke-width="2" />
    <line x1="33" y1="0" x2="33" y2="30" stroke="#FFFFFF" stroke-width="6" />
    <line x1="45" y1="0" x2="45" y2="30" stroke="#FFFFFF" stroke-width="2" />
    <line x1="55" y1="0" x2="55" y2="30" stroke="#FFFFFF" stroke-width="4" />
    <line x1="68" y1="0" x2="68" y2="30" stroke="#FFFFFF" stroke-width="8" />
    <line x1="84" y1="0" x2="84" y2="30" stroke="#FFFFFF" stroke-width="2" />
    <line x1="94" y1="0" x2="94" y2="30" stroke="#FFFFFF" stroke-width="5" />
    <line x1="108" y1="0" x2="108" y2="30" stroke="#FFFFFF" stroke-width="3" />
    <line x1="118" y1="0" x2="118" y2="30" stroke="#FFFFFF" stroke-width="7" />
    <line x1="135" y1="0" x2="135" y2="30" stroke="#FFFFFF" stroke-width="3" />
    <line x1="145" y1="0" x2="145" y2="30" stroke="#FFFFFF" stroke-width="5" />
    <text x="80" y="58" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.6)" letter-spacing="3">2026-EXHIBIT</text>
  </g>
</svg>
